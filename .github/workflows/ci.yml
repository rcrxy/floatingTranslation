name: CI

on:
   push:
      branches:
         - main
   pull_request:
      branches:
         - main

permissions:
   contents: read

concurrency:
   group: ci-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   test:
      name: test
      runs-on: ubuntu-latest
      timeout-minutes: 20

      steps:
         - name: Checkout
           uses: actions/checkout@v6

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24.x
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Check formatting
           run: npm run format:check

         - name: Lint
           run: npm run lint

         - name: Test
           run: xvfb-run -a npm test

         - name: Package
           run: npm run package
