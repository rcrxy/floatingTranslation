name: Feature request
description: |
   Suggestions for new features or improvements to existing behavior.
   建议新功能或现有行为改进。
title: "[Feature]: "
labels:
   - enhancement
   - triage
body:
   - type: markdown
     attributes:
        value: |
           Please prioritize describing the problems to be solved and the usage scenarios. Implementation plans are not mandatory.
           Do not submit API Keys, AccessKeys, Secrets, Tokens, or other sensitive credentials.
           ----------------
           请优先描述要解决的问题和使用场景。实现方案不是必填项。
           请勿提交 API Key、AccessKey、Secret、Token 或其他敏感凭据。

   - type: textarea
     id: problem
     attributes:
        label: Description | 描述
        description: |
           Describe the specific details of the feature and the expected style.
           描述功能的具体内容和期望样式。
     validations:
        required: true

   - type: textarea
     id: proposed-solution
     attributes:
        label: Suggested Plan | 建议方案
        description: |
           Optional. If you have ideas for implementation, interface suggestions, or alternatives, you can explain them here.
           可选。如果你有实现思路、接口建议或替代方案，可以在此说明。

   - type: checkboxes
     id: sensitive-data-confirmation
     attributes:
        label: 敏感信息确认
        options:
           - label: 我已确认以上内容不包含 API Key、AccessKey、Secret、Token 或其他敏感凭据。
             required: true
