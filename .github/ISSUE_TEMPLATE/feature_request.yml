name: Feature request
description: 建议新功能或现有行为改进
title: "[Feature]: "
labels:
   - enhancement
   - triage
body:
   - type: markdown
     attributes:
        value: |
           请优先描述要解决的问题和使用场景。实现方案不是必填项。

           请勿提交 API Key、AccessKey、Secret、Token 或其他敏感凭据。

   - type: textarea
     id: problem
     attributes:
        label: 要解决的问题
        description: 当前遇到了什么限制、困难或缺失的能力？
     validations:
        required: true

   - type: textarea
     id: use-case
     attributes:
        label: 使用场景
        description: 请说明该需求会在什么情况下使用，以及对哪些用户有帮助。
     validations:
        required: true

   - type: textarea
     id: expected-behavior
     attributes:
        label: 期望行为
        description: 你期望 Floating Translation 提供怎样的行为或结果？
     validations:
        required: true

   - type: textarea
     id: proposed-solution
     attributes:
        label: 建议方案
        description: 可选。如果你有实现思路、接口建议或替代方案，可以在此说明。

   - type: textarea
     id: additional-context
     attributes:
        label: 其他说明
        description: 可补充示例、截图、相关项目链接或其他背景信息。

   - type: checkboxes
     id: sensitive-data-confirmation
     attributes:
        label: 敏感信息确认
        options:
           - label: 我已确认以上内容不包含 API Key、AccessKey、Secret、Token 或其他敏感凭据。
             required: true
